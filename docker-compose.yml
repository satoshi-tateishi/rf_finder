services:
  db:
    image: mysql:8.4
    container_name: rf_finder_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rf_finder
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rf_network

  web:
    build: .
    container_name: rf_finder_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8084:8000"
    volumes:
      - .:/code
      - ./static:/static
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - rf_network
      - shin-on-internal   # portal-app:8000 へ直接アクセスするために追加

networks:
  rf_network:
    driver: bridge
  shin-on-internal:
    external: true   # docker network create shin-on-internal で事前作成が必要

volumes:
  mysql_data:
