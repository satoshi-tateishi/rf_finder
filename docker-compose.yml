version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rf_finder_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rf_finder
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rf_network

  web:
    build: .
    container_name: rf_finder_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - rf_network

  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: rf_finder_apache
    ports:
      - "8084:80"
    volumes:
      - ./static:/static
      - ./media:/media
    depends_on:
      - web
    networks:
      - rf_network

networks:
  rf_network:
    driver: bridge

volumes:
  mysql_data:
