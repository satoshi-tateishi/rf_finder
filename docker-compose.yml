services:
  db:
    image: mysql:8.4
    container_name: rf_finder_db_dev
    restart: always
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --performance-schema=OFF
    environment:
      MYSQL_DATABASE: rf_finder
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - rf_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      target: development
    container_name: rf_finder_web_dev
    # 開発環境はボリュームマウント(.:/code)のため root で実行
    user: root
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8084:8000"
    volumes:
      - .:/code
      - ./static:/static
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      rf_network:
      shin-on-internal:
        aliases:
          - rf-finder-app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5); assert response.status == 204"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  rf_network:
    driver: bridge
  shin-on-internal:
    external: true   # docker network create shin-on-internal で事前作成が必要

volumes:
  mysql_data_dev:
