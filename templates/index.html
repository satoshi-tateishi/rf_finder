<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RF Finder - 特ラ運用調整支援</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 4px; }
        .ch-btn { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; position: relative; border-radius: 4px; border-width: 1px; }
        .ch-btn.disabled { background-color: #f3f4f6; color: #d1d5db; border-color: #e5e7eb; cursor: not-allowed; }
        .ch-btn.available { background-color: white; border-color: #d1d5db; color: #374151; }
        .ch-btn.available:hover { border-color: #3b82f6; background-color: #eff6ff; }
        .ch-btn.selected { background-color: #dcfce7; color: #166534; font-weight: bold; border-color: #22c55e; border-width: 2px; }
        
        .device-indicators { position: absolute; bottom: 2px; left: 2px; right: 2px; display: flex; flex-direction: column; gap: 1px; }
        .device-bar { height: 3px; border-radius: 1px; }
        
        /* ガードバンド表示 */
        .gb-indicator { position: absolute; top: 0; height: 3px; background-color: #fbbf24; opacity: 0.7; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <!-- Header -->
    <nav class="bg-[#00c300] text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-tower-broadcast"></i> RF Finder
            </h1>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-2xl">
        
        <!-- Search Section -->
        <div class="bg-white p-4 rounded-lg shadow-sm mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">施設検索</label>
            <div class="relative">
                <input type="text" id="facility-search-input" 
                    class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
                    placeholder="施設名、住所を入力...">
                <div id="search-results" class="absolute w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 hidden max-h-60 overflow-y-auto"></div>
            </div>
        </div>

        <!-- Keep List Section -->
        <div id="keep-list-section" class="hidden bg-white p-4 rounded-lg shadow-sm mb-4">
            <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-green-600"></i> キープリスト
            </h3>
            <div id="keep-list" class="space-y-2 mb-4">
                <!-- Keep items dynamic -->
            </div>
        </div>

        <!-- Channel Selection Section -->
        <div id="ch-selection-section" class="hidden space-y-4">
            <!-- Legend -->
            <div class="bg-white p-4 rounded-lg shadow-sm border-t border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider">機種別対応帯域</p>
                <div id="device-legend" class="flex flex-wrap gap-3 text-[10px] text-gray-600">
                    <!-- Dynamic Legend -->
                </div>
                <div class="mt-4 flex gap-2 text-[10px]">
                    <div class="flex items-center gap-1"><span class="w-2 h-1 bg-yellow-400 opacity-70"></span> ガードバンド (1MHz)</div>
                    <div class="flex items-center gap-1"><span class="w-2 h-1 bg-gray-200"></span> 使用不可</div>
                </div>
            </div>

            <div id="facility-channels-container" class="space-y-4">
                <!-- Per-facility channel grids dynamic -->
            </div>

            <!-- Action Buttons -->
            <div class="mt-6">
                <button onclick="goToAdjustment()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-paper-plane"></i> 運用調整連絡へ
                </button>
            </div>
        </div>

        <div id="welcome-msg" class="text-center py-20 text-gray-300">
            <i class="fa-solid fa-building fa-4x mb-4 opacity-20"></i>
            <p>施設を検索してキープリストに追加してください</p>
        </div>

    </div>

    <!-- Device Data -->
    <script id="devices-data" type="application/json">
        [
            {% for device in devices %}
            {
                "id": {{ device.id }},
                "name": "{{ device.model_name }}",
                "min": {{ device.min_frequency }},
                "max": {{ device.max_frequency }}
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]
    </script>

    <script>
        const API_SEARCH = '/api/facilities/search/';
        const API_DETAIL = '/api/facilities/';
        
        let keepList = [];
        const devices = JSON.parse(document.getElementById('devices-data').textContent);
        
        // デバイス名に基づく色設定
        function getDeviceColor(name) {
            if (name.includes('SR2050')) return '#f97316'; // オレンジ (Tailwind orange-500)
            if (name.includes('3732') && name.includes('N')) return '#3b82f6'; // ブルー (Tailwind blue-500)
            if (name.includes('3732') && name.includes('L')) return '#22c55e'; // グリーン (Tailwind green-500)
            return '#94a3b8'; // デフォルト (gray-400)
        }

        // Initial legend setup
        window.addEventListener('DOMContentLoaded', () => {
            const legend = document.getElementById('device-legend');
            if (legend) {
                devices.forEach((d) => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-1';
                    div.innerHTML = `<span class="w-2 h-2 rounded-full" style="background-color: ${getDeviceColor(d.name)}"></span> ${d.name}`;
                    legend.appendChild(div);
                });
            }
        });

        const searchInput = document.getElementById('facility-search-input');
        const resultsDiv = document.getElementById('search-results');
        let sortable = null;

        // Initialize Sortable on Keep List
        function initSortable() {
            const el = document.getElementById('keep-list');
            if (sortable) sortable.destroy();
            
            sortable = Sortable.create(el, {
                handle: '.drag-handle',
                animation: 150,
                onEnd: (evt) => {
                    const movedItem = keepList.splice(evt.oldIndex, 1)[0];
                    keepList.splice(evt.newIndex, 0, movedItem);
                    renderKeepList(); // Update numbers
                    
                    // TVチャンネル選択UIが表示されている場合は、その順番も更新する
                    if (!document.getElementById('ch-selection-section').classList.contains('hidden')) {
                        renderChannelSelection();
                    }
                }
            });
        }

        // Initial setup for search
        searchInput.addEventListener('input', async (e) => {
            const q = e.target.value;
            if (q.length < 2) { resultsDiv.classList.add('hidden'); return; }

            try {
                const res = await fetch(`${API_SEARCH}?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                resultsDiv.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    data.results.forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0';
                        const categoryBadge = f.category ? `<span class="bg-gray-100 text-gray-600 text-[9px] px-1.5 py-0.5 rounded border border-gray-200 whitespace-nowrap">${f.category}</span>` : '';
                        const areaBadge = f.applied_area ? `<span class="bg-blue-50 text-blue-600 text-[9px] px-1.5 py-0.5 rounded border border-blue-100 whitespace-nowrap">${f.applied_area}</span>` : '';
                        const zipDisplay = f.zip_code ? `<span class="mr-1">〒${f.zip_code}</span>` : '';
                        
                        item.innerHTML = `
                            <div class="flex flex-col gap-1">
                                <div class="flex items-center gap-1 flex-wrap">
                                    <span class="font-bold text-sm text-gray-800">${f.name}</span>
                                    ${categoryBadge}
                                    ${areaBadge}
                                </div>
                                <div class="text-[10px] text-gray-400">${zipDisplay}${f.address}</div>
                            </div>
                        `;
                        item.onclick = () => addToKeepList(f);
                        resultsDiv.appendChild(item);
                    });
                    resultsDiv.classList.remove('hidden');
                } else {
                    resultsDiv.classList.add('hidden');
                }
            } catch (err) { console.error(err); }
        });

        async function addToKeepList(f) {
            resultsDiv.classList.add('hidden');
            searchInput.value = '';
            
            // 重複チェック
            if (!keepList.find(item => item.id === f.id)) {
                // 詳細情報を取得（利用可能周波数など）
                try {
                    const res = await fetch(`${API_DETAIL}${f.id}/`);
                    const data = await res.json();
                    
                    keepList.push({ 
                        ...f, 
                        selectedChannels: [], 
                        availableChannels: data.available_channels 
                    });
                    renderKeepList();
                    renderChannelSelection();
                    document.getElementById('ch-selection-section').classList.remove('hidden');
                } catch (err) {
                    console.error('Error fetching facility details:', err);
                }
            }
            
            document.getElementById('welcome-msg').classList.add('hidden');
            document.getElementById('keep-list-section').classList.remove('hidden');
        }

        function removeFromKeepList(id) {
            keepList = keepList.filter(f => f.id !== id);
            renderKeepList();
            
            if (keepList.length === 0) {
                document.getElementById('keep-list-section').classList.add('hidden');
                document.getElementById('welcome-msg').classList.remove('hidden');
                document.getElementById('ch-selection-section').classList.add('hidden');
            } else {
                renderChannelSelection();
            }
        }

        function renderKeepList() {
            const container = document.getElementById('keep-list');
            container.innerHTML = '';
            
            keepList.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 p-3 bg-gray-50 rounded-lg border border-gray-100';
                
                const categoryBadge = f.category ? `<span class="bg-gray-100 text-gray-600 text-[9px] px-1.5 py-0.5 rounded border border-gray-200 whitespace-nowrap">${f.category}</span>` : '';
                const areaBadge = f.applied_area ? `<span class="bg-blue-50 text-blue-600 text-[9px] px-1.5 py-0.5 rounded border border-blue-100 whitespace-nowrap">${f.applied_area}</span>` : '';
                const zipDisplay = f.zip_code ? `<span class="mr-1">〒${f.zip_code}</span>` : '';

                div.innerHTML = `
                    <div class="drag-handle text-gray-400 cursor-grab active:cursor-grabbing px-1 py-2">
                        <i class="fa-solid fa-grip-vertical"></i>
                    </div>
                    <div class="flex items-center justify-center w-6 h-6 rounded-full bg-green-100 text-green-700 text-xs font-bold shrink-0">
                        ${index + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-1 flex-wrap">
                                <span class="font-bold text-sm text-gray-800">${f.name}</span>
                                ${categoryBadge}
                                ${areaBadge}
                            </div>
                            <div class="text-[10px] text-gray-400">${zipDisplay}${f.address}</div>
                        </div>
                    </div>
                    <button onclick="removeFromKeepList(${f.id})" class="text-gray-300 hover:text-red-500 shrink-0">
                        <i class="fa-solid fa-circle-xmark fa-lg"></i>
                    </button>
                `;
                container.appendChild(div);
            });
            initSortable();
        }

        function renderChannelSelection() {
            const container = document.getElementById('facility-channels-container');
            container.innerHTML = '';
            
            keepList.forEach(f => {
                const section = document.createElement('div');
                section.className = 'bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-500';
                
                const categoryBadge = f.category ? `<span class="bg-gray-100 text-gray-600 text-[9px] px-1.5 py-0.5 rounded border border-gray-200 whitespace-nowrap">${f.category}</span>` : '';
                const areaBadge = f.applied_area ? `<span class="bg-blue-50 text-blue-600 text-[9px] px-1.5 py-0.5 rounded border border-blue-100 whitespace-nowrap">${f.applied_area}</span>` : '';
                const zipDisplay = f.zip_code ? `<span class="mr-1">〒${f.zip_code}</span>` : '';

                section.innerHTML = `
                    <div class="mb-4">
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-1 flex-wrap">
                                <span class="font-bold text-sm text-gray-800">${f.name}</span>
                                ${categoryBadge}
                                ${areaBadge}
                            </div>
                            <div class="text-[10px] text-gray-400">${zipDisplay}${f.address}</div>
                        </div>
                    </div>
                    <div id="grid-${f.id}" class="ch-grid"></div>
                `;
                
                container.appendChild(section);
                renderRFGrid(f, document.getElementById(`grid-${f.id}`));
            });
        }

        function renderRFGrid(facility, gridElement) {
            gridElement.innerHTML = '';
            
            for (let ch = 13; ch <= 53; ch++) {
                const chData = facility.availableChannels.find(c => c.channel === ch);
                const base_start = 470000 + (ch - 13) * 6000;
                const base_end = base_start + 6000;

                const btn = document.createElement('div');
                const isSelected = facility.selectedChannels.includes(ch);
                btn.className = `ch-btn ${chData ? 'available' : 'disabled'} ${isSelected ? 'selected' : ''}`;
                btn.innerHTML = `<span>${ch}</span>`;
                
                if (chData) {
                    btn.onclick = () => {
                        if (facility.selectedChannels.includes(ch)) {
                            facility.selectedChannels = facility.selectedChannels.filter(c => c !== ch);
                            btn.classList.remove('selected');
                        } else {
                            facility.selectedChannels.push(ch);
                            btn.classList.add('selected');
                        }
                    };
                    
                    // ガードバンド表示 (上部にライン)
                    if (chData.gb_lower > 0) {
                        const gb = document.createElement('div');
                        gb.className = 'gb-indicator';
                        gb.style.left = '0';
                        gb.style.width = `${(chData.gb_lower / 6000) * 100}%`;
                        btn.appendChild(gb);
                    }
                    if (chData.gb_upper > 0) {
                        const gb = document.createElement('div');
                        gb.className = 'gb-indicator';
                        gb.style.right = '0';
                        gb.style.width = `${(chData.gb_upper / 6000) * 100}%`;
                        btn.appendChild(gb);
                    }

                    // デバイスインジケーター (下部にライン)
                    const indicators = document.createElement('div');
                    indicators.className = 'device-indicators';
                    
                    devices.forEach((d) => {
                        const overlap_min = Math.max(d.min, base_start);
                        const overlap_max = Math.min(d.max, base_end);
                        
                        const bar = document.createElement('div');
                        bar.className = 'device-bar';
                        
                        if (overlap_min < overlap_max) {
                            // 対応している場合
                            bar.style.backgroundColor = getDeviceColor(d.name);
                            bar.style.width = `${(overlap_max - overlap_min) / 6000 * 100}%`;
                            bar.style.marginLeft = `${(overlap_min - base_start) / 6000 * 100}%`;
                        } else {
                            // 対応していない場合（透明なバーを置いて高さを確保）
                            bar.style.backgroundColor = 'transparent';
                            bar.style.width = '100%';
                        }
                        indicators.appendChild(bar);
                    });
                    btn.appendChild(indicators);
                }
                gridElement.appendChild(btn);
            }
        }

        function goToAdjustment() {
            // 次のフェーズの実装
            console.log('Adjustment request with keepList:', keepList);
            alert('運用調整連絡への遷移（未実装）');
        }
    </script>
</body>
</html>
