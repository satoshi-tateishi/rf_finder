{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2段階認証 - RF Finder</title>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/android-chrome-192x192.png' %}">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Noto Sans JP';
            src: url('{% static "fonts/NotoSansJP-Regular.ttf" %}') format('truetype');
        }
        body { font-family: 'Noto Sans JP', sans-serif; }
        .otp-digit {
            width: 44px;
            height: 52px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .otp-digit:focus {
            border-color: #00c300;
            box-shadow: 0 0 0 3px rgba(0, 195, 0, 0.1);
        }
        .otp-digit.error {
            border-color: #ef4444;
            background-color: #fef2f2;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <nav class="bg-[#00c300] text-white p-4 shadow-md">
        <div class="container mx-auto">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-tower-broadcast"></i> RF Finder
            </h1>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden p-8 text-center animate-in fade-in zoom-in duration-300">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-shield-halved fa-3x"></i>
            </div>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-2">2段階認証</h2>
            <p class="text-sm text-gray-500 mb-8">
                LINE WORKS に送信された<br>6桁の認証コードを入力してください。
            </p>

            {% if error %}
            <div class="bg-red-50 text-red-600 text-xs p-3 rounded-lg mb-6 border border-red-200">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ error }}
            </div>
            {% endif %}

            {% if status %}
            <div class="bg-green-50 text-green-600 text-xs p-3 rounded-lg mb-6 border border-green-200">
                <i class="fa-solid fa-circle-check mr-1"></i> {{ status }}
            </div>
            {% endif %}

            <form action="{% url 'accounts:otp_verify' %}" method="post" id="otp-form" autocomplete="off">
                {% csrf_token %}
                <div class="flex justify-center items-center gap-2 mb-8">
                    <input type="text" data-index="0" class="otp-digit" maxlength="1" inputmode="numeric" required autofocus>
                    <input type="text" data-index="1" class="otp-digit" maxlength="1" inputmode="numeric" required>
                    <input type="text" data-index="2" class="otp-digit" maxlength="1" inputmode="numeric" required>
                    <span class="text-gray-300 font-bold">-</span>
                    <input type="text" data-index="3" class="otp-digit" maxlength="1" inputmode="numeric" required>
                    <input type="text" data-index="4" class="otp-digit" maxlength="1" inputmode="numeric" required>
                    <input type="text" data-index="5" class="otp-digit" maxlength="1" inputmode="numeric" required>
                </div>
                <input type="hidden" name="code" id="full-code">

                <button type="submit" class="w-full bg-[#00c300] hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md hover:shadow-lg transform active:scale-95 flex items-center justify-center gap-2">
                    <span>認証する</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </form>
            
            <div class="mt-8 border-t pt-6">
                <form action="{% url 'accounts:otp_resend' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="text-xs text-blue-600 hover:underline font-medium">
                        認証コードを再送する
                    </button>
                </form>
            </div>

            <div class="mt-6 text-[10px] text-gray-400">
                株式会社新音<br>特ラ運用調整支援システム
            </div>
        </div>
    </div>

    <script>
        (function() {
            const digits = document.querySelectorAll('.otp-digit');
            const hiddenInput = document.getElementById('full-code');
            const form = document.getElementById('otp-form');

            digits.forEach((input, idx) => {
                // 入力時の処理
                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val.substring(0, 1);
                    
                    if (val && idx < digits.length - 1) {
                        digits[idx + 1].focus();
                    }
                    updateHiddenValue();
                });

                // 戻るキーの処理
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                        digits[idx - 1].focus();
                    }
                });

                // ペースト処理
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                    const numbers = pasteData.replace(/[^0-9]/g, '').substring(0, 6).split('');
                    
                    numbers.forEach((num, i) => {
                        if (digits[i]) digits[i].value = num;
                    });
                    updateHiddenValue();
                    if (numbers.length > 0) {
                        const nextIdx = Math.min(numbers.length, digits.length - 1);
                        digits[nextIdx].focus();
                    }
                });
            });

            function updateHiddenValue() {
                let code = '';
                digits.forEach(d => code += d.value);
                hiddenInput.value = code;
            }

            form.addEventListener('submit', () => {
                updateHiddenValue();
            });
        })();
    </script>
</body>
</html>
