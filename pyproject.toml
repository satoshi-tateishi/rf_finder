[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# W: pycodestyle warnings
# I: isort (import sorting)
# B: flake8-bugbear
# DJ: flake8-django
select = ["E", "F", "W", "I", "B", "DJ"]
ignore = [
    "E501", # Line too long
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
