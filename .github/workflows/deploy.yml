name: Test and Deploy to Home Server

on:
  push:
    branches:
      - release

jobs:
  # ===== テストジョブ =====

  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

  test-python:
    name: Django Unit Tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rf_finder_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/rf_finder_test
          SECRET_KEY: test-key-for-github-actions
          DEBUG: 'True'
          LINE_WORKS_PRIVATE_KEY_PATH: ./keys/line_works_private_key.key
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ===== デプロイジョブ =====

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-python, test-python]
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 56834
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # 1. パーミッションの一時的な修正（git操作のため）
            sudo chown -R $USER:$USER .

            # 2. 最新コードの取得
            GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no' git fetch origin
            git reset --hard origin/release

            # 3. Dockerコンテナの起動・ビルド
            docker compose -f docker-compose.prod.yml up -d --build

            # 4. データベースマイグレーション
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput

            # 5. 静的ファイルの集約（static_rootディレクトリへの集約）
            # コンテナ内の /code/static_root がホストの static_root に同期されます
            docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput --clear

            # 6. Apache（www-data）がファイルを読み取れるように権限を設定
            # static_root 全体の所有権を Apache ユーザーに変更し、適切なパーミッションを付与
            sudo chown -R www-data:www-data static_root
            sudo chmod -R 755 static_root

            # 7. セキュリティ設定: 各種ファイルのパーミッション修正
            if [ -f keys/line_works_private_key.key ]; then
              sudo chmod 600 keys/line_works_private_key.key
              sudo chown www-data:www-data keys/line_works_private_key.key
            fi
            sudo chmod 600 .env

            echo "Deployment completed successfully!"
