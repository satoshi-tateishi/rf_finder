name: Test and Deploy to Home Server

on:
  push:
    branches:
      - release

jobs:
  # ===== テストジョブ =====

  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

  test-python:
    name: Django Unit Tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rf_finder_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/rf_finder_test
          SECRET_KEY: test-key-for-github-actions
          DEBUG: 'True'
          LINE_WORKS_PRIVATE_KEY_PATH: ./keys/line_works_private_key.key
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ===== デプロイジョブ =====

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-python, test-python]
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 56834
          script: |
            # appleboy/ssh-actionの既定シェル（POSIX sh）で、途中エラーを即時検知する
            set -eu
            cd ${{ secrets.DEPLOY_PATH }}

            # 1. 最新コードの取得
            GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no' git fetch --prune origin release
            git reset --hard origin/release

            # 2. Compose secretと環境変数ファイルをデプロイユーザーだけが読めるようにする
            test -f .env
            test -f keys/line_works_private_key.key
            chmod 600 .env keys/line_works_private_key.key

            # 3. migrate/collectstaticはコンテナ起動コマンド内で一度だけ実行する
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 180

            echo "Deployment completed successfully!"
