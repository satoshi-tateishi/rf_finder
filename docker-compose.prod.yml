version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rf_finder_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # 環境変数は .env から読み込むため、ここでは最小限の定義
      MYSQL_DATABASE: rf_finder
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rf_network

  web:
    build: .
    container_name: rf_finder_web
    # 本番では gunicorn 等の使用も検討可能だが、現状は runserver を維持
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - rf_network

networks:
  rf_network:
    driver: bridge

volumes:
  mysql_data:
