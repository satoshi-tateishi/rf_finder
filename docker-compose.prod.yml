services:
  db:
    image: mysql:8.4
    container_name: rf_finder_db
    restart: always
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --performance-schema=OFF
    environment:
      # 環境変数は .env から読み込むため、ここでは最小限の定義
      MYSQL_DATABASE: rf_finder
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - rf_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      target: production
    container_name: rf_finder_web
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:80 --workers 3"
    ports:
      - '${APP_PORT:-8085}:80'
    env_file:
      - .env
    environment:
      LINE_WORKS_PRIVATE_KEY_PATH: /run/rf_finder/line_works_private_key
    secrets:
      - line_works_private_key
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      rf_network:
      shin-on-internal:
        aliases:
          - rf-finder-app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1/healthz/', timeout=5); assert response.status == 204"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  rf_network:
    driver: bridge
  shin-on-internal:
    external: true   # docker network create shin-on-internal で事前作成が必要

volumes:
  mysql_data:

secrets:
  line_works_private_key:
    file: ./keys/line_works_private_key.key
