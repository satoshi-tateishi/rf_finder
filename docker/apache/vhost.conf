<VirtualHost *:80>
    ServerName localhost

    # Proxy to Django
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://web:8000/
    ProxyPassReverse / http://web:8000/

    # Static/Media files handled by Apache
    Alias /static/ /static/
    Alias /media/ /media/

    <Directory "/static">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory "/media">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Example SSO/Mellon configuration (placeholder)
    # <Location />
    #     AuthType Mellon
    #     MellonEnable info
    #     # Required headers pass to Django for Auth
    #     RequestHeader set X-Remote-User %{MELLON_NAME_ID}e
    # </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
